name: Expo quality gates

on:
  pull_request:
    branches:
      - migration/expo-sdk58
    paths:
      - "expo-app/**"
      - "firestore.rules"
      - ".github/workflows/expo-family-care-quality.yml"
permissions:
  contents: read

concurrency:
  group: expo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-and-rules:
    name: Expo typecheck, lint, Jest and Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24.12.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Set up Java 21 for Firestore Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install locked dependencies
        working-directory: expo-app
        run: npm ci

      - name: Dependency advisory inventory (non-blocking)
        id: dependency-audit
        continue-on-error: true
        working-directory: expo-app
        run: |
          audit_file="$RUNNER_TEMP/npm-audit.json"
          if npm audit --json > "$audit_file"; then
            audit_status=0
          else
            audit_status=$?
          fi
          node - "$audit_file" "$audit_status" <<'NODE'
          const fs = require('node:fs');
          const auditPath = process.argv[2];
          const auditStatus = Number(process.argv[3]);
          let audit;
          try {
            audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          } catch {
            console.log('npm audit did not return a readable JSON report; inspect the npm output above.');
            process.exit(0);
          }
          const metadata = audit.metadata?.vulnerabilities ?? {};
          console.log('Dependency advisory totals:', JSON.stringify(metadata));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            const via = (item.via ?? []).map((entry) => typeof entry === 'string'
              ? entry
              : {
                name: entry.name,
                title: entry.title,
                url: entry.url,
                range: entry.range,
                severity: entry.severity,
              });
            console.log(JSON.stringify({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via,
            }));
          }
          if (auditStatus !== 0) console.log('npm audit reported advisories; this inventory is non-blocking while existing dependency debt is triaged.');
          NODE
      - name: TypeScript
        working-directory: expo-app
        run: npm run typecheck

      - name: ESLint
        working-directory: expo-app
        run: npm run lint

      - name: Jest unit and UI tests
        working-directory: expo-app
        run: npm test

      - name: Firestore Rules Emulator tests
        working-directory: expo-app
        run: npm run test:rules
